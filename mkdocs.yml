site_name: Patchling
site_url: https://toxicwind.github.io/codeflux-patchling/
docs_dir: docs
site_dir: site
strict: true

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  features:
    - content.code.annotate
  palette:
    scheme: slate
    primary: deep purple
    accent: blue

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Installation: installation.md
  - API Reference: api.md
  - CLI Reference: cli.md
  - patchling-apply: patchling-apply.md
  - Agent Loops: examples/automation.md
  - Core Concepts: concepts.md
  - Architecture: concepts/architecture.md
  - Examples:
      - Basic Usage: examples/basic.md
      - Advanced Refactoring: examples/advanced.md
  - Development:
      - Testing Practices: development/testing.md
      - Contributing Guide: development/contributing.md
  - Troubleshooting: troubleshooting.md
extra:
  social:
    - name: PyPI
      icon: fontawesome/brands/python
      link: https://pypi.org/project/patchling/
    - name: GitHub
      icon: fontawesome/brands/github
      link: https://github.com/toxicwind/codeflux-patchling
plugins:
