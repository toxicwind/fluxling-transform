site_name: Fluxling
site_url: https://toxicwind.github.io/fluxling/
docs_dir: docs
site_dir: site
strict: true

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  features:
    - content.code.annotate
  palette:
    scheme: slate
    primary: deep purple
    accent: blue

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Installation: installation.md
  - API Reference: api.md
  - CLI Reference: cli.md
  - fluxling-apply: fluxling-apply.md
  - Agent Loops: examples/automation.md
  - Core Concepts: concepts.md
  - Architecture: concepts/architecture.md
  - Examples:
      - Basic Usage: examples/basic.md
      - Advanced Refactoring: examples/advanced.md
  - Development:
      - Testing Practices: development/testing.md
      - Contributing Guide: development/contributing.md
  - Troubleshooting: troubleshooting.md
extra:
  social:
    - name: PyPI
      icon: fontawesome/brands/python
      link: https://pypi.org/project/fluxling/
    - name: GitHub
      icon: fontawesome/brands/github
      link: https://github.com/toxicwind/fluxling
    - name: nanoodle.com
      icon: fontawesome/solid/diagram-project
      link: https://nanoodle.com
    - name: patchling (JS)
      icon: fontawesome/brands/js
      link: https://github.com/255BITS/patchling
    - name: 255labs.xyz
      icon: fontawesome/solid/globe
      link: https://255labs.xyz
plugins:
